          if (!tx) return;
          state.activeTxId = txId;

          const allTargets = [];
          state.categories.forEach((c) => {
            c.children.forEach((s) => allTargets.push({ value: c.id + '|' + s.id, label: c.name + ' › ' + s.name }));
          });
          const curVal = tx.catId + '|' + tx.subId;

          document.getElementById('tx-dialog-body').innerHTML = `
            <div class="cf-dialog-head">
              <div>
                <h2 id="tx-dialog-title" style="font-size:1.05rem;">${escapeHtml(tx.merchant)}</h2>
                <div style="font-size:0.78rem;color:var(--text-secondary);">${tx.date} · ${escapeHtml(tx.bank)} · ${escapeHtml(tx.accountLabel)}</div>
              </div>
              <button type="button" class="cf-btn cf-btn--compact" id="btn-close-tx-dialog">Fermer</button>
            </div>
            <div class="tabular-amount" style="font-size:1.35rem;font-weight:700;">
              ${formatMoney(tx.amountCents, tx.currency, tx.amountCents > 0)}
              ${tx.currency === 'USD' ? `<span style="font-size:0.85rem;color:var(--text-muted);font-weight:400;"> ≈ ${formatMoney(toEurCents(tx.amountCents, 'USD'), 'EUR', false)}</span>` : ''}
            </div>
            <details style="font-size:0.78rem;color:var(--text-secondary);">
              <summary style="cursor:pointer;min-block-size:36px;">Libellé brut relevé PDF</summary>
              <code style="display:block;padding:8px;background:var(--bg-subtle);border-radius:6px;margin-block-start:4px;">${escapeHtml(tx.rawLabel)}</code>
            </details>
            <form id="tx-edit-form" style="display:flex;flex-direction:column;gap:12px;">
              <div class="cf-field-group">
                <label class="cf-field-label" for="tx-note-input">Note personnalisée ${isOffline() ? '(Enregistrée en outbox hors-ligne)' : ''}</label>
                <textarea id="tx-note-input" class="cf-field-input" rows="2" placeholder="Ajouter une note rapide…">${escapeHtml(tx.note)}</textarea>
              </div>
              <div class="cf-field-group">
                <label class="cf-field-label" for="tx-cat-select">Catégorie &rarr; Sous-catégorie (devient Manuel)</label>
                <select id="tx-cat-select" class="cf-field-input">
                  ${allTargets
                    .map(
                      (t) => `<option value="${t.value}" ${t.value === curVal ? 'selected' : ''}>${escapeHtml(t.label)}</option>`
                    )
                    .join('')}
                </select>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;">
                <button type="button" class="cf-btn" id="btn-create-rule-from-tx">Créer une règle depuis ce libellé</button>
                <button type="submit" class="cf-btn cf-btn--primary">Enregistrer</button>
              </div>
            </form>
          `;

          const dlg = document.getElementById('tx-dialog');
          dlg.showModal();
          document.getElementById('btn-close-tx-dialog').onclick = () => {
            dlg.returnValue = '';
            dlg.close();
          };
          document.getElementById('btn-create-rule-from-tx').onclick = () => {
            state.ruleDraftPattern = tx.merchant.split(' ').slice(0, 2).join(' ').toUpperCase();
            state.tab = 'transactions';
            state.txSubtab = 'rules';
            dlg.close();
            renderApp();
            announce('Formulaire de règle pré-rempli depuis ' + tx.merchant);
          };
          document.getElementById('tx-edit-form').onsubmit = (e) => {
            e.preventDefault();
            tx.note = document.getElementById('tx-note-input').value.trim();
            const [newCat, newSub] = document.getElementById('tx-cat-select').value.split('|');
            if (newCat !== tx.catId || newSub !== tx.subId) {
              tx.catId = newCat;
              tx.subId = newSub;
              tx.source = 'Manuel';
            }
            if (isOffline()) state.outboxCount += 1;
            dlg.returnValue = 'saved';
            dlg.close();
            renderApp();
            announce(isOffline() ? 'Modification enregistrée dans la file outbox hors-ligne.' : 'Opération mise à jour.');
          };
        }

          let html = '';
          if (mode === 'create') {
            html = `

              <p style="font-size:0.8125rem;color:var(--text-secondary);">

                  <label class="cf-field-label" for="cat-target-in">Catégorie de réaffectation cible</label>
                  <select id="cat-target-in" class="cf-field-input">
                    ${others.map((o) => `<option value="${o.id}">${escapeHtml(o.name)}</option>`).join('')}
                  </select>
                </div>
                <div style="display:flex;justify-content:flex-end;">
                  <button type="submit" class="cf-btn ${isDelete ? 'cf-btn--danger' : 'cf-btn--primary'}">${isDelete ? 'Confirmer suppression' : 'Fusionner'}</button>
                </div>
              </form>
            `;
          }

          document.getElementById('category-dialog-body').innerHTML = html;
          const dlg = document.getElementById('category-dialog');
          dlg.showModal();
          document.getElementById('btn-close-cat-dialog').onclick = () => dlg.close();
          document.getElementById('cat-form').onsubmit = (e) => {
            e.preventDefault();
            if (mode === 'create') {
              const name = document.getElementById('cat-name-in').value.trim();
              const parentId = document.getElementById('cat-parent-in').value;
              if (parentId) {
                const p = state.categories.find((c) => c.id === parentId);
                if (p) p.children.push({ id: 'sub-' + Date.now(), name });
              } else {
                state.categories.push({ id: 'cat-' + Date.now(), name, group: 'Dépenses variables', children: [] });
              }
            } else if (cat) {
              const targetId = document.getElementById('cat-target-in').value;

                state.transactions.forEach((tx) => {

            renderApp();
            announce('Arbre des catégories mis à jour.');

          const allTargets = [];
          state.categories.forEach((c) => {
            c.children.forEach((s) => allTargets.push({ value: c.id + '|' + s.id, label: c.name + ' › ' + s.name }));
          });
          const curTarget = existing ? existing.catId + '|' + existing.subId : 'cat-abos|sub-cloud';
          const curAmount = existing ? (existing.expectedAmountCents / 100).toFixed(2) : '';

          document.getElementById('recurring-dialog-body').innerHTML = `
            <div class="cf-dialog-head">
              <h2 id="rec-dialog-title" style="font-size:1.05rem;">${existing ? 'Ajuster l’échéance' : 'Ajouter une échéance récurrente'}</h2>
              <button type="button" class="cf-btn cf-btn--compact" id="btn-close-rec-dialog">Fermer</button>
            </div>
            <p style="font-size:0.78rem;color:var(--text-secondary);">
              Rapprochement automatique dès qu’un relevé bancaire correspondant sera importé (sans doublon).
            </p>
            <form id="recurring-form" style="display:flex;flex-direction:column;gap:12px;">
              <div class="cf-field-group">
                <label class="cf-field-label" for="rec-name-in">Nom de l’échéance</label>
                <input id="rec-name-in" class="cf-field-input" type="text" required minlength="2" placeholder="Ex. Assurance Auto" value="${existing ? escapeHtml(existing.merchant) : ''}" />
                <span class="cf-field-error">Veuillez saisir un nom (min. 2 caractères).</span>
              </div>
              <div style="display:grid;grid-template-columns:1fr 110px;gap:10px;">
                <div class="cf-field-group">
                  <label class="cf-field-label" for="rec-amount-in">Montant</label>
                  <input id="rec-amount-in" class="cf-field-input tabular-amount" type="number" min="0.01" step="0.01" required placeholder="45.00" value="${curAmount}" />
                  <span class="cf-field-error">Montant strictement positif requis.</span>
                </div>
                <div class="cf-field-group">
                  <label class="cf-field-label" for="rec-cur-in">Devise</label>
                  <select id="rec-cur-in" class="cf-field-input">
                    <option value="EUR" ${!existing || existing.currency === 'EUR' ? 'selected' : ''}>EUR (€)</option>
                    <option value="USD" ${existing && existing.currency === 'USD' ? 'selected' : ''}>USD ($)</option>
                  </select>
                </div>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div class="cf-field-group">
                  <label class="cf-field-label" for="rec-cad-in">Fréquence</label>
                  <select id="rec-cad-in" class="cf-field-input">
                    <option value="monthly" ${!existing || existing.cadence === 'monthly' ? 'selected' : ''}>Mensuelle</option>
                    <option value="quarterly" ${existing && existing.cadence === 'quarterly' ? 'selected' : ''}>Trimestrielle</option>
                    <option value="yearly" ${existing && existing.cadence === 'yearly' ? 'selected' : ''}>Annuelle</option>
                    <option value="weekly" ${existing && existing.cadence === 'weekly' ? 'selected' : ''}>Hebdomadaire</option>
                  </select>
                </div>
                <div class="cf-field-group">
                  <label class="cf-field-label" for="rec-day-in">Jour du mois (1–31)</label>
                  <input id="rec-day-in" class="cf-field-input tabular-amount" type="number" min="1" max="31" required value="${existing ? existing.billingDay : 15}" />
                  <span class="cf-field-error">Jour entre 1 et 31 requis.</span>
                </div>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div class="cf-field-group">
                  <label class="cf-field-label" for="rec-dir-in">Direction</label>
                  <select id="rec-dir-in" class="cf-field-input">
                    <option value="expense" ${!existing || existing.direction === 'expense' ? 'selected' : ''}>Dépense</option>
                    <option value="income" ${existing && existing.direction === 'income' ? 'selected' : ''}>Revenu</option>
                  </select>
                </div>
                <div class="cf-field-group">
                  <label class="cf-field-label" for="rec-cat-in">Catégorie</label>
                  <select id="rec-cat-in" class="cf-field-input">
                    ${allTargets
                      .map((t) => `<option value="${t.value}" ${t.value === curTarget ? 'selected' : ''}>${escapeHtml(t.label)}</option>`)
                      .join('')}
                  </select>
                </div>
              </div>
              <div style="display:flex;justify-content:flex-end;gap:8px;">
                <button type="submit" class="cf-btn cf-btn--primary">${existing ? 'Enregistrer' : 'Ajouter au calendrier'}</button>
              </div>
            </form>
          `;

          const dlg = document.getElementById('recurring-dialog');
          dlg.showModal();
          document.getElementById('btn-close-rec-dialog').onclick = () => {
            dlg.returnValue = '';
            dlg.close();
          };
          document.getElementById('recurring-form').onsubmit = (e) => {
            e.preventDefault();
            const merchant = document.getElementById('rec-name-in').value.trim();
            const amountEur = Number(document.getElementById('rec-amount-in').value);
            const day = Number(document.getElementById('rec-day-in').value);
            if (merchant.length < 2 || !(amountEur > 0) || day < 1 || day > 31) return;

            const currency = document.getElementById('rec-cur-in').value;
            const cadence = document.getElementById('rec-cad-in').value;
            const direction = document.getElementById('rec-dir-in').value;
            const [catId, subId] = document.getElementById('rec-cat-in').value.split('|');
            const expectedAmountCents = Math.round(amountEur * 100);
            const curMonthNum = Number(state.budgetMonth.split('-')[1]);

            if (existing) {
              existing.merchant = merchant;
              existing.expectedAmountCents = expectedAmountCents;
              existing.currency = currency;
              existing.cadence = cadence;
              existing.billingDay = day;
              existing.direction = direction;
              existing.catId = catId;
              existing.subId = subId;
              if (cadence === 'yearly' && !existing.activeMonths) existing.activeMonths = [curMonthNum];
              if (cadence === 'quarterly' && !existing.activeMonths) existing.activeMonths = [2, 5, 8, 11];
            } else {
              state.recurring.push({
                id: 'rec-man-' + Date.now(),
                merchant,
                cadence,
                billingDay: day,
                activeMonths: cadence === 'yearly' ? [curMonthNum] : cadence === 'quarterly' ? [2, 5, 8, 11] : undefined,
                expectedAmountCents,
                currency,
                direction,
                source: 'manual',
                status: 'confirmed',
                deltaPct: 0,
                catId,
                subId,
                notes: 'Ajout manuel',
              });
              if (direction === 'income') state.includeRecurringIncome = true;
            }
            dlg.returnValue = 'saved';
            dlg.close();
            renderApp();
            announce(existing ? 'Échéance récurrente mise à jour.' : 'Nouvelle échéance ajoutée au calendrier.');
          };
        }

        function openRolloverPopover(catId, triggerEl) {
          const cat = state.categories.find((c) => c.id === catId);
          const item = state.budgets[state.budgetMonth].items[catId];
          if (!cat || !item) return;

          const history = item.rolloverHistory || [
            { month: 'Sept. 2026', planned: item.limitCents, spent: item.limitCents - 3200, delta: 3200 },
            { month: 'Oct. 2026', planned: item.limitCents, spent: item.limitCents - (item.carryInCents - 3200), delta: item.carryInCents - 3200 },
          ];
          document.getElementById('rollover-popover-body').innerHTML = `
            <div>Catégorie : <strong>${escapeHtml(cat.name)}</strong></div>
            ${history
              .map(
                (h) => `
              <div style="display:flex;justify-content:space-between;border-block-start:1px solid var(--border-subtle);padding-block-start:4px;">
                <span>${h.month}</span>
                <span class="tabular-amount">${formatMoney(h.planned, 'EUR', false)} − ${formatMoney(h.spent, 'EUR', false)} = <strong>${formatMoney(h.delta, 'EUR', true)}</strong></span>
              </div>
            `
              )
              .join('')}
            <div style="border-block-start:1px solid var(--border-strong);padding-block-start:6px;display:flex;justify-content:space-between;">
              <strong>Disponible ce mois :</strong>
              <strong class="tabular-amount cf-amount-pos">${formatMoney(item.limitCents + item.carryInCents, 'EUR', false)}</strong>
            </div>
          `;

          const pop = document.getElementById('rollover-popover');
          const supportsPopover = Object.hasOwn(HTMLElement.prototype, 'popover');
          if (supportsPopover && typeof pop.showPopover === 'function') {
            pop.classList.remove('cf-popover-fallback', 'is-open');
            pop.showPopover();
            document.getElementById('btn-close-popover').onclick = () => pop.hidePopover();
          } else {
            pop.classList.add('cf-popover-fallback', 'is-open');
            document.getElementById('btn-close-popover').onclick = () => pop.classList.remove('is-open');
          }
          if (triggerEl) pop.dataset.returnFocus = triggerEl.dataset.openRollover || '';
        }

        /* =========================================================
           RENDU PRINCIPAL & BINDING DES ÉVÉNEMENTS
           ========================================================= */
        function renderApp() {
          renderNavigation();
          const main = document.getElementById('cf-main');

          if (state.appState === 'empty') {
            main.innerHTML = renderEmptyState();
          } else {
            const banner = renderStateBanner();
            let body = '';
            if (state.tab === 'overview') body = renderOverviewTab();
            else if (state.tab === 'budget') body = renderBudgetTab();
            else if (state.tab === 'transactions') body = renderTransactionsTab();
            else body = renderSyncTab();
            main.innerHTML = banner + body;
          }
          bindDynamicEvents();
        }

        function bindDynamicEvents() {
          document.querySelectorAll('[data-nav-tab]').forEach((btn) => {
            btn.onclick = () => {
              state.tab = btn.getAttribute('data-nav-tab');
              renderApp();
            };
          });

          document.querySelectorAll('[data-scope]').forEach((btn) => {
            btn.onclick = () => {
              state.scope = btn.getAttribute('data-scope');
              if (state.scope === 'acc-r2') state.currencyMode = 'USD';
              renderApp();
            };
          });

          document.querySelectorAll('[data-currency]').forEach((btn) => {
            btn.onclick = () => {
              state.currencyMode = btn.getAttribute('data-currency');
              renderApp();
            };
          });

          document.querySelectorAll('[data-period]').forEach((btn) => {
            btn.onclick = () => {
              state.period = btn.getAttribute('data-period');
              renderApp();
            };
          });

          document.querySelectorAll('[data-drill-cat]').forEach((btn) => {
            btn.onclick = () => {
              const id = btn.getAttribute('data-drill-cat');
              state.drillCatId = state.drillCatId === id ? null : id;
              renderApp();
            };
          });

          document.querySelectorAll('[data-jump-sub]').forEach((btn) => {
            btn.onclick = () => {
              state.txSearch = btn.getAttribute('data-jump-sub');
              state.tab = 'transactions';
              state.txSubtab = 'ops';
              renderApp();
            };
          });

          document.querySelectorAll('[data-horizon]').forEach((btn) => {
            btn.onclick = () => {
              state.horizonMonths = Number(btn.getAttribute('data-horizon'));
              renderApp();
            };
          });

          function updateProjectionInPlace() {
            const cur = state.currencyMode;
            const { points, netMonthlySim } = computeProjectionSeries();
            const finalProj = points[points.length - 1];
            const svgBox = document.getElementById('proj-svg-box');
            const summary = document.getElementById('proj-summary');
            const netBox = document.getElementById('proj-net-monthly');
            const valVar = document.getElementById('val-var');
            const valInc = document.getElementById('val-inc');
            const valOne = document.getElementById('val-one');
            if (svgBox) svgBox.innerHTML = renderProjectionSvg(cur);
            if (summary) {
              summary.innerHTML =
                '<span>Solde projeté à +' +
                state.horizonMonths +
                'M : <strong class="tabular-amount cf-amount-pos">' +
                formatMoney(finalProj.trend, cur, false) +
                '</strong></span><span class="tabular-amount" style="color:var(--text-muted);">Bande [' +
                formatMoney(finalProj.prudent, cur, false) +
                ' ; ' +
                formatMoney(finalProj.optimiste, cur, false) +
                ']</span>';
            }
            if (netBox) {
              netBox.innerHTML =
                'Épargne mensuelle simulée : <strong class="tabular-amount">' +
                formatMoney(netMonthlySim, cur, true) +
                ' / mois</strong>';
            }
            if (valVar) valVar.textContent = (state.whatIf.varDeltaPct > 0 ? '+' : '') + state.whatIf.varDeltaPct + ' %';
            if (valInc) valInc.textContent = '+' + state.whatIf.extraIncomeEur + ' € / mois';
            if (valOne) valOne.textContent = '−' + state.whatIf.oneOffEur + ' €';
          }

          const rngVar = document.getElementById('rng-var');
          const rngInc = document.getElementById('rng-inc');
          const rngOne = document.getElementById('rng-one');
          if (rngVar) {
            rngVar.oninput = () => {
              state.whatIf.varDeltaPct = Number(rngVar.value);
              updateProjectionInPlace();
            };
          }
          if (rngInc) {
            rngInc.oninput = () => {
              state.whatIf.extraIncomeEur = Number(rngInc.value);
              updateProjectionInPlace();
            };
          }
          if (rngOne) {
            rngOne.oninput = () => {
              state.whatIf.oneOffEur = Number(rngOne.value);
              updateProjectionInPlace();
            };
          }

          document.querySelectorAll('[data-step-slider]').forEach((btn) => {
            btn.onclick = () => {
              const [key, deltaStr] = btn.getAttribute('data-step-slider').split(':');
              const d = Number(deltaStr);
              if (key === 'var') state.whatIf.varDeltaPct = Math.max(-30, Math.min(30, state.whatIf.varDeltaPct + d));
              if (key === 'inc') state.whatIf.extraIncomeEur = Math.max(0, Math.min(1500, state.whatIf.extraIncomeEur + d));
              if (key === 'one') state.whatIf.oneOffEur = Math.max(0, Math.min(3000, state.whatIf.oneOffEur + d));
              renderApp();
            };
          });

          const resetWhatIf = document.getElementById('btn-reset-whatif');
          if (resetWhatIf) {
            resetWhatIf.onclick = () => {
              state.whatIf = { varDeltaPct: 0, extraIncomeEur: 0, oneOffEur: 0 };
              renderApp();
            };
          }

          const regenBrief = document.getElementById('btn-regen-brief');
          if (regenBrief) {
            regenBrief.onclick = () => {
              state.briefVersion = (state.briefVersion + 1) % BRIEF_VERSIONS.length;
              renderApp();
              announce('Bilan IA mensuel régénéré avec succès.');
            };
          }

          document.querySelectorAll('[data-budget-month]').forEach((btn) => {
            btn.onclick = () => {
              state.budgetMonth = btn.getAttribute('data-budget-month');
              state.selectedRecDay = null;
              renderApp();
            };
          });

          document.querySelectorAll('[data-budget-sub]').forEach((btn) => {
            btn.onclick = () => {
              state.budgetSubtab = btn.getAttribute('data-budget-sub');
              state.selectedRecDay = null;
              renderApp();
            };
          });

          const jumpRecBtn = document.getElementById('btn-jump-recurring-cal');
          if (jumpRecBtn) {
            jumpRecBtn.onclick = () => {
              state.tab = 'budget';
              state.budgetSubtab = 'recurring';
              state.selectedRecDay = null;
              renderApp();
              announce('Ouverture de Budget > Récurrents et Calendrier');
            };
          }

          const incRecChk = document.getElementById('chk-include-rec-income');
          if (incRecChk) {
            incRecChk.onchange = () => {
              state.includeRecurringIncome = incRecChk.checked;
              renderApp();
            };
          }

          const addRecBtn = document.getElementById('btn-add-recurring');
          if (addRecBtn) {
            addRecBtn.onclick = () => openRecurringDialog(null);
          }

          document.querySelectorAll('[data-rec-day]').forEach((btn) => {
            btn.onclick = () => {
              const d = Number(btn.getAttribute('data-rec-day'));
              state.selectedRecDay = state.selectedRecDay === d ? null : d;
              renderApp();
            };
          });

          const clearRecDay = document.getElementById('btn-clear-rec-day');
          if (clearRecDay) {
            clearRecDay.onclick = () => {
              state.selectedRecDay = null;
              renderApp();
            };
          }

          document.querySelectorAll('[data-rec-action]').forEach((btn) => {
            btn.onclick = () => {
              const [act, id] = btn.getAttribute('data-rec-action').split(':');
              const s = state.recurring.find((x) => x.id === id);
              if (!s) return;
              if (act === 'confirm') {
                s.status = 'confirmed';
                renderApp();
                announce('Échéance confirmée : ' + s.merchant);
              } else if (act === 'dismiss') {
                s.status = 'dismissed';
                renderApp();
                announce('Échéance ignorée : ' + s.merchant);
              } else if (act === 'cancel') {
                s.status = 'cancelled';
                s.cancelledAt = '2026-11-26';
                renderApp();
                announce('Échéance marquée résiliée : ' + s.merchant);
              } else if (act === 'adjust') {
                openRecurringDialog(s.id);
              }
            };
          });

          document.querySelectorAll('[data-budget-view]').forEach((btn) => {
            btn.onclick = () => {
              state.budgetView = btn.getAttribute('data-budget-view');
              renderApp();
            };
          });

          document.querySelectorAll('[data-open-rollover]').forEach((btn) => {
            btn.onclick = () => openRolloverPopover(btn.getAttribute('data-open-rollover'), btn);
          });

          document.querySelectorAll('[data-edit-budget]').forEach((btn) => {
            btn.onclick = () => openBudgetDialog(btn.getAttribute('data-edit-budget'));
          });

          document.querySelectorAll('[data-tx-sub]').forEach((btn) => {
            btn.onclick = () => {
              state.txSubtab = btn.getAttribute('data-tx-sub');
              renderApp();
            };
          });

          const searchIn = document.getElementById('tx-search-input');
          if (searchIn) {
            searchIn.oninput = () => {
              state.txSearch = searchIn.value;
              renderApp();
              const nextIn = document.getElementById('tx-search-input');
              if (nextIn) {
                nextIn.focus();
                nextIn.setSelectionRange(nextIn.value.length, nextIn.value.length);
              }
            };
          }

          document.querySelectorAll('[data-open-tx]').forEach((el) => {
            el.onclick = () => openTxDialog(el.getAttribute('data-open-tx'));
            el.onkeydown = (e) => {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                openTxDialog(el.getAttribute('data-open-tx'));
              }
            };
          });

          document.querySelectorAll('[data-rev-action]').forEach((btn) => {
            btn.onclick = () => {
              const [act, id] = btn.getAttribute('data-rev-action').split(':');
              const item = state.reviewQueue.find((r) => r.id === id);
              if (!item) return;
              if (act === 'validate' || act === 'correct') {
                const newTx = {
                  id: 'tx-rev-' + item.id,
                  date: item.date,
                  bank: item.bank,
                  accountId: 'acc-b1',
                  accountLabel: item.accountLabel,
                  merchant: item.merchant,
                  rawLabel: item.merchant,
                  catId: item.suggestedCatId,
                  subId: item.suggestedSubId,
                  source: 'Manuel',
                  confidenceBp: item.confidenceBp,
                  note: act === 'validate' ? 'Validé depuis file IA' : 'À corriger depuis file IA',
                  amountCents: item.amountCents,
                  currency: item.currency,
                  isTransfer: false,
                };
                state.transactions.unshift(newTx);
                state.reviewQueue = state.reviewQueue.filter((r) => r.id !== id);
                renderApp();
                if (act === 'correct') openTxDialog(newTx.id);
                else announce('Opération validée.');
                return;
              }
              state.reviewQueue = state.reviewQueue.filter((r) => r.id !== id);
              renderApp();
              announce('Opération ignorée de la file.');
            };
          });

          document.querySelectorAll('[data-accept-sug]').forEach((btn) => {
            btn.onclick = () => {
              const id = btn.getAttribute('data-accept-sug');
              const sug = state.ruleSuggestions.find((s) => s.id === id);
              if (sug) {
                state.rules.push({
                  id: 'rule-' + Date.now(),
                  pattern: sug.pattern,
                  bank: 'Tous',
                  catId: sug.catId,
                  subId: sug.subId,
                  enabled: true,
                  matches: sug.matchCount,
                });
                state.ruleSuggestions = state.ruleSuggestions.filter((s) => s.id !== id);
                renderApp();
                announce('Règle gratuite créée : ' + sug.pattern);
              }
            };
          });

          document.querySelectorAll('[data-dismiss-sug]').forEach((btn) => {
            btn.onclick = () => {
              const id = btn.getAttribute('data-dismiss-sug');
              state.ruleSuggestions = state.ruleSuggestions.filter((s) => s.id !== id);
              renderApp();
            };
          });

          const ruleForm = document.getElementById('rule-form');
          if (ruleForm) {
            ruleForm.onsubmit = (e) => {
              e.preventDefault();
              const pat = document.getElementById('rule-pattern').value.trim();
              if (pat.length < 3) {
                document.getElementById('rule-pattern').classList.add('user-invalid-fallback');
                return;
              }
              const bank = document.getElementById('rule-bank').value;
              const [catId, subId] = document.getElementById('rule-target').value.split('|');
              state.rules.push({ id: 'rule-' + Date.now(), pattern: pat.toUpperCase(), bank, catId, subId, enabled: true, matches: 3 });
              state.ruleDraftPattern = '';
              renderApp();
              announce('Règle ajoutée.');
            };
          }

          document.querySelectorAll('[data-rule-move]').forEach((btn) => {
            btn.onclick = () => {
              const [dir, id] = btn.getAttribute('data-rule-move').split(':');
              const idx = state.rules.findIndex((r) => r.id === id);
              if (idx < 0) return;
              const swap = dir === 'up' ? idx - 1 : idx + 1;
              if (swap < 0 || swap >= state.rules.length) return;
              const tmp = state.rules[idx];
              state.rules[idx] = state.rules[swap];
              state.rules[swap] = tmp;
              renderApp();
            };
          });

          document.querySelectorAll('[data-rule-toggle]').forEach((btn) => {
            btn.onclick = () => {
              const r = state.rules.find((x) => x.id === btn.getAttribute('data-rule-toggle'));
              if (r) {
                r.enabled = !r.enabled;
                renderApp();
              }
            };
          });

          document.querySelectorAll('[data-cat-modal]').forEach((btn) => {
            btn.onclick = () => openCategoryDialog(btn.getAttribute('data-cat-modal'));
          });

          const emptyStart = document.getElementById('btn-empty-start');
          if (emptyStart) {
            emptyStart.onclick = () => {
              state.appState = 'syncing';
              syncSimulatorControls();
              renderApp();
            };
          }

          const finishSync = document.getElementById('btn-finish-sync');
          if (finishSync) {
            finishSync.onclick = () => {
              state.appState = 'populated';
              state.backfillDone = 2940;
              syncSimulatorControls();
              renderApp();
              announce('Synchronisation et lots IA terminés.');
            };
          }

          const retryBtn = document.getElementById('btn-retry-failed') || document.getElementById('btn-retry-failed-sync');
          if (retryBtn) {
            retryBtn.onclick = () => {
              const failed = state.driveFiles.find((f) => f.status === 'failed_partial');
              if (failed) {
                failed.status = 'archived';
                failed.txCount = 19;
              }
              state.appState = 'populated';
              syncSimulatorControls();
              renderApp();
              announce('Relevé PDF repris avec succès et archivé sur Drive.');
            };
          }

          const retrySyncBtn = document.getElementById('btn-retry-failed-sync');
          if (retrySyncBtn) {
            retrySyncBtn.onclick = () => {
              const failed = state.driveFiles.find((f) => f.status === 'failed_partial');
              if (failed) {
                failed.status = 'archived';
                failed.txCount = 19;
              }
              state.appState = 'populated';
              syncSimulatorControls();
              renderApp();
              announce('Relevé PDF repris avec succès et archivé sur Drive.');
            };
          }

          const startBackfill = document.getElementById('btn-start-backfill');
          if (startBackfill) {
            startBackfill.onclick = () => {
              state.backfillRunning = true;
              state.backfillDone = Math.min(state.backfillTotal, state.backfillDone + 300);
              if (state.backfillDone >= state.backfillTotal) state.backfillRunning = false;
              renderApp();
              announce('Progression IA : ' + state.backfillDone + ' / ' + state.backfillTotal);
            };
          }

          const cancelBackfill = document.getElementById('btn-cancel-backfill');
          if (cancelBackfill) {
            cancelBackfill.onclick = () => {
              state.backfillRunning = false;
              renderApp();
              announce('Rattrapage IA mis en pause.');
            };
          }

          const flushOutbox = document.getElementById('btn-flush-outbox');
          if (flushOutbox) {
            flushOutbox.onclick = () => {
              state.outboxCount = 0;
              renderApp();
              announce('Outbox locale envoyée vers Neon.');
            };
          }

          const headerSync = document.getElementById('btn-header-sync');
          if (headerSync) {
            headerSync.onclick = () => {
              state.tab = 'sync';
              renderApp();
            };
          }

          const syncDriveBtn = document.getElementById('btn-sync-drive');
          if (syncDriveBtn) {
            syncDriveBtn.onclick = () => {
              state.appState = 'syncing';
              syncSimulatorControls();
              renderApp();
              announce('Synchronisation Drive & Gemini démarrée.');
            };
          }

          const apkBtn = document.getElementById('btn-apk-dl');
          if (apkBtn) {
            apkBtn.onclick = () => {
              announce('Simulation : téléchargement de clairflux-v2.0.0-pixel8.apk (6,4 Mo) déclenché.');
            };
          }
        }

        /* =========================================================
           INITIALISATION SIMULATEUR & LISTENERS GLOBAUX
           ========================================================= */
        document.querySelectorAll('[data-set-vp]').forEach((btn) => {
          btn.onclick = () => {
            state.vp = btn.getAttribute('data-set-vp');
            syncSimulatorControls();
          };
        });

        document.querySelectorAll('[data-set-state]').forEach((btn) => {
          btn.onclick = () => {
            state.appState = btn.getAttribute('data-set-state');
            if (state.appState === 'offline' && state.outboxCount === 0) state.outboxCount = 2;
            if (state.appState === 'partial-error') {
              const f = state.driveFiles.find((x) => x.id === 'f-6');
              if (f) f.status = 'failed_partial';
            }
            syncSimulatorControls();
            renderApp();
          };
        });

        document.getElementById('btn-rotate-pixel').onclick = () => {
          state.rot = state.rot === '90' ? '270' : '90';
          syncSimulatorControls();
        };

        document.getElementById('btn-toggle-safe').onclick = () => {
          state.showSafe = !state.showSafe;
          syncSimulatorControls();
        };

        window.addEventListener('resize', () => {
          syncSimulatorControls();
        });

        syncSimulatorControls();
        renderApp();
      })();
    </script>
  </body>
</html>
