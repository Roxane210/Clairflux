<!doctype html>
<html lang="fr" data-vp="desktop" data-rot="90" data-state="populated">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f7f6f2" />
    <title>ClairFlux v2 — Prototype Mock-First (Desktop &amp; Google Pixel 8)</title>
    <style>
      :root {
        --font-display: 'Plus Jakarta Sans', 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
        --font-sans: 'DM Sans', 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace;

        --bg-canvas: #f7f6f2;
        --bg-surface: #ffffff;
        --bg-subtle: #efede6;
        --bg-hover: #f2f0e9;
        --border-subtle: #dedad0;
        --border-strong: #c2bdb0;

        --text-primary: #14171a;
        --text-secondary: #4a515a;
        --text-muted: #5c646e;

        --accent: #0f5c4d;
        --accent-hover: #0b473b;
        --accent-soft: #e6f2ef;

        --danger: #b42318;
        --danger-soft: #fef3f2;
        --warning: #92400e;
        --warning-soft: #fef6e6;
        --info: #1d4ed8;
        --info-soft: #eff6ff;

        --radius-surface: 12px;
        --radius-control: 8px;
        --nav-rail-width: 240px;
        --landscape-rail-width: 76px;
        --mobile-nav-height: 64px;

        /* Safe-area dynamiques (absorbent le poinçon Pixel 8 en Portrait, Paysage 90° et 270°) */
        --sim-sat: env(safe-area-inset-top, 0px);
        --sim-sar: env(safe-area-inset-right, 0px);
        --sim-sab: env(safe-area-inset-bottom, 0px);
        --sim-sal: env(safe-area-inset-left, 0px);
        --sim-scale: 1;
      }

      html[data-vp='desktop'],
      html[data-vp='mobile-320'] {
        --sim-sat: 0px;
        --sim-sar: 0px;
        --sim-sab: 0px;
        --sim-sal: 0px;
      }

      html[data-vp='pixel-portrait'] {
        --sim-sat: 34px;
        --sim-sar: 0px;
        --sim-sab: 24px;
        --sim-sal: 0px;
      }

      html[data-vp='pixel-landscape'][data-rot='90'] {
        --sim-sat: 14px;
        --sim-sar: 12px;
        --sim-sab: 20px;
        --sim-sal: 40px;
      }

      html[data-vp='pixel-landscape'][data-rot='270'] {
        --sim-sat: 14px;
        --sim-sar: 40px;
        --sim-sab: 20px;
        --sim-sal: 12px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        overflow-x: clip;
        background: #e9e6dc;
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
      }

      html[data-vp='fullscreen'] {
        background: var(--bg-canvas);
      }

      body {
        margin: 0;
        min-block-size: 100dvh;
        overflow-x: clip;
        color: var(--text-primary);
        font-size: 0.875rem;
      }

      h1,
      h2,
      h3,
      h4 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 700;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      p {
        margin: 0;
      }

      .tabular-amount {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .cf-touch-target {
        min-block-size: 44px;
        min-inline-size: 44px;
      }

      .cf-sr-only {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* =========================================================
         BANDEAU SIMULATEUR EXTERNE AU VIEWPORT (HORS APPLICATION)
         ========================================================= */
      .sim-toolbar {
        position: sticky;
        inset-block-start: 0;
        z-index: 60;
        background: #14171a;
        color: #f7f6f2;
        border-block-end: 1px solid #2e343b;
        padding: 8px 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.75rem;
      }

      .sim-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .sim-label {
        color: #b7bec7;
        font-weight: 600;
        margin-inline-end: 2px;
      }

      .sim-btn {
        min-block-size: 34px;
        padding: 5px 10px;
        border-radius: 6px;
        border: 1px solid #3c434d;
        background: #21262c;
        color: #f7f6f2;
        font-family: var(--font-sans);
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      .sim-btn:hover {
        background: #2b323a;
      }

      .sim-btn[aria-pressed='true'] {
        background: var(--accent);
        border-color: #2aa389;
        color: #ffffff;
      }

      .sim-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .sim-btn:focus-visible {
        outline: 2px solid #5eead4;
        outline-offset: 2px;
      }

      .sim-meta {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        color: #9ae6d4;
        font-size: 0.72rem;
      }

      /* =========================================================
         SCÈNE ET GABARITS MATÉRIELS SIMULÉS (DESKTOP / PIXEL 8)
         ========================================================= */
      .sim-stage {
        padding: 20px 16px 36px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-block-size: calc(100dvh - 54px);
      }

      html[data-vp='fullscreen'] .sim-stage {
        padding: 0;
        display: block;
      }

      .sim-device-wrap {
        transform-origin: top center;
        transform: scale(var(--sim-scale));
      }

      html[data-vp='fullscreen'] .sim-device-wrap {
        transform: none;
        inline-size: 100%;
      }

      .sim-device {
        position: relative;
        background: var(--bg-canvas);
        overflow: hidden;
      }

      html[data-vp='desktop'] .sim-device {
        inline-size: 1440px;
        block-size: 900px;
        border-radius: 14px;
        border: 1px solid #b5afa2;
        box-shadow: 0 24px 60px rgba(20, 23, 26, 0.16);
      }

      html[data-vp='pixel-portrait'] .sim-device {
        inline-size: 412px;
        block-size: 915px;
        border-radius: 38px;
        outline: 10px solid #1e2228;
        box-shadow: 0 24px 60px rgba(20, 23, 26, 0.28);
      }

      html[data-vp='pixel-landscape'] .sim-device {
        inline-size: 915px;
        block-size: 412px;
        border-radius: 34px;
        outline: 10px solid #1e2228;
        box-shadow: 0 24px 60px rgba(20, 23, 26, 0.28);
      }

      html[data-vp='mobile-320'] .sim-device {
        inline-size: 320px;
        block-size: 568px;
        border-radius: 26px;
        outline: 8px solid #1e2228;
        box-shadow: 0 24px 60px rgba(20, 23, 26, 0.24);
      }

      html[data-vp='fullscreen'] .sim-device {
        inline-size: 100%;
        min-block-size: calc(100dvh - 54px);
        overflow: visible;
      }

      /* Poinçon caméra Google Pixel 8 & Barre gestuelle Android */
      .sim-camera-hole,
      .sim-gesture-bar,
      .sim-safe-overlay {
        display: none;
        pointer-events: none;
      }

      html[data-vp='pixel-portrait'] .sim-camera-hole {
        display: block;
        position: absolute;
        z-index: 45;
        inset-block-start: 10px;
        inset-inline-start: 50%;
        transform: translateX(-50%);
        inline-size: 18px;
        block-size: 18px;
        border-radius: 999px;
        background: #0d0f12;
        box-shadow: inset 0 0 0 2px #262b32;
      }

      html[data-vp='pixel-landscape'][data-rot='90'] .sim-camera-hole {
        display: block;
        position: absolute;
        z-index: 45;
        inset-inline-start: 10px;
        inset-block-start: 50%;
        transform: translateY(-50%);
        inline-size: 18px;
        block-size: 18px;
        border-radius: 999px;
        background: #0d0f12;
        box-shadow: inset 0 0 0 2px #262b32;
      }

      html[data-vp='pixel-landscape'][data-rot='270'] .sim-camera-hole {
        display: block;
        position: absolute;
        z-index: 45;
        inset-inline-end: 10px;
        inset-block-start: 50%;
        transform: translateY(-50%);
        inline-size: 18px;
        block-size: 18px;
        border-radius: 999px;
        background: #0d0f12;
        box-shadow: inset 0 0 0 2px #262b32;
      }

      html[data-vp='pixel-portrait'] .sim-gesture-bar,
      html[data-vp='pixel-landscape'] .sim-gesture-bar {
        display: block;
        position: absolute;
        z-index: 45;
        inset-block-end: 7px;
        inset-inline-start: 50%;
        transform: translateX(-50%);
        inline-size: 120px;
        block-size: 4px;
        border-radius: 999px;
        background: rgba(20, 23, 26, 0.42);
      }

      html[data-show-safe='true'] .sim-safe-overlay {
        display: block;
        position: absolute;
        inset: 0;
        z-index: 40;
        border-block-start: var(--sim-sat) solid rgba(15, 92, 77, 0.22);
        border-inline-end: var(--sim-sar) solid rgba(180, 35, 24, 0.22);
        border-block-end: var(--sim-sab) solid rgba(15, 92, 77, 0.22);
        border-inline-start: var(--sim-sal) solid rgba(180, 35, 24, 0.22);
      }

      /* =========================================================
         RACINE APPLICATIVE CLAIRFLUX v2
         ========================================================= */
      .cf-app-root {
        inline-size: 100%;
        block-size: 100%;
        overflow-x: clip;
        overflow-y: auto;
        scrollbar-gutter: stable;
        background: var(--bg-canvas);
        color: var(--text-primary);
        container: app / inline-size;
      }

      html[data-vp='fullscreen'] .cf-app-root {
        block-size: auto;
        min-block-size: calc(100dvh - 54px);
        overflow-y: visible;
      }

      .cf-shell {
        display: flex;
        min-block-size: 100%;
        inline-size: 100%;
      }

      /* Élévation unique : une seule surface bordée sur le canvas, zéro cartes imbriquées */
      .cf-surface {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-surface);
      }

      .cf-divider {
        border: 0;
        border-block-start: 1px solid var(--border-subtle);
        margin: 0;
      }

      /* Rail latéral (Desktop 240px ou Pixel 8 Paysage 76px + safe-area-left) */
      .cf-rail {
        display: none;
      }

      .cf-main {
        flex: 1 1 auto;
        min-inline-size: 0;
        max-inline-size: 1200px;
        margin-inline: auto;
        padding-block: calc(14px + var(--sim-sat)) calc(var(--mobile-nav-height) + var(--sim-sab) + 20px);
        padding-inline: calc(16px + var(--sim-sal)) calc(16px + var(--sim-sar));
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Barre basse mobile Portrait (< 1024px hors mode paysage compact) */
      .cf-bottom-nav {
        position: sticky;
        inset-block-end: 0;
        z-index: 25;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        block-size: calc(var(--mobile-nav-height) + var(--sim-sab));
        padding-block-end: var(--sim-sab);
        padding-inline-start: var(--sim-sal);
        padding-inline-end: var(--sim-sar);
        background: var(--bg-surface);
        border-block-start: 1px solid var(--border-subtle);
      }

      html[data-vp='fullscreen'] .cf-bottom-nav {
        position: fixed;
        inset-inline: 0;
      }

      .cf-nav-btn {
        position: relative;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        min-block-size: 44px;
        min-inline-size: 44px;
        padding: 4px;
        border: 0;
        background: transparent;
        color: var(--text-secondary);
        font-family: var(--font-sans);
        font-size: 0.72rem;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
      }

      .cf-nav-btn[aria-current='page'] {
        color: var(--accent);
        box-shadow: inset 0 2px 0 0 var(--accent);
      }

      .cf-nav-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-inline-size: 18px;
        block-size: 18px;
        padding-inline: 5px;
        border-radius: 999px;
        background: var(--warning-soft);
        border: 1px solid var(--warning);
        color: var(--warning);
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 0.6875rem;
        font-weight: 700;
      }

      .cf-bottom-nav .cf-nav-badge {
        position: absolute;
        inset-block-start: 4px;
        inset-inline-end: 14%;
      }

      /* Desktop >= 1024px (Mode Desktop simulé ou Plein écran >= 1024px hors paysage compact) */
      html[data-vp='desktop'] .cf-rail {
        position: sticky;
        inset-block-start: 0;
        flex: 0 0 var(--nav-rail-width);
        inline-size: var(--nav-rail-width);
        block-size: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px 16px;
        background: var(--bg-surface);
        border-inline-end: 1px solid var(--border-subtle);
      }

      html[data-vp='desktop'] .cf-rail-nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      html[data-vp='desktop'] .cf-nav-btn {
        flex-direction: row;
        justify-content: space-between;
        padding-inline: 12px;
        border-radius: var(--radius-control);
        font-size: 0.875rem;
        gap: 10px;
      }

      html[data-vp='desktop'] .cf-nav-btn-inner {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      html[data-vp='desktop'] .cf-nav-btn[aria-current='page'] {
        background: var(--accent-soft);
        box-shadow: none;
      }

      html[data-vp='desktop'] .cf-bottom-nav {
        display: none;
      }

      html[data-vp='desktop'] .cf-main {
        padding-block: 24px 32px;
        padding-inline: 32px;
        gap: 20px;
      }

      /* Plein écran >= 1024px Desktop */
      @media (min-width: 1024px) {
        html[data-vp='fullscreen'] .cf-rail {
          position: sticky;
          inset-block-start: 54px;
          flex: 0 0 var(--nav-rail-width);
          inline-size: var(--nav-rail-width);
          block-size: calc(100dvh - 54px);
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          padding: 24px 16px;
          background: var(--bg-surface);
          border-inline-end: 1px solid var(--border-subtle);
        }

        html[data-vp='fullscreen'] .cf-rail-nav {
          display: flex;
          flex-direction: column;
          gap: 6px;
        }

        html[data-vp='fullscreen'] .cf-nav-btn {
          flex-direction: row;
          justify-content: space-between;
          padding-inline: 12px;
          border-radius: var(--radius-control);
          font-size: 0.875rem;
        }

        html[data-vp='fullscreen'] .cf-nav-btn-inner {
          display: inline-flex;
          align-items: center;
          gap: 10px;
        }

        html[data-vp='fullscreen'] .cf-nav-btn[aria-current='page'] {
          background: var(--accent-soft);
          box-shadow: none;
        }

        html[data-vp='fullscreen'] .cf-bottom-nav {
          display: none;
        }

        html[data-vp='fullscreen'] .cf-main {
          padding-block: 24px 32px;
          padding-inline: 32px;
          gap: 20px;
        }
      }

      /* =========================================================
         ORIENTATION PAYSAGE COMPACTE PIXEL 8 (915x412 & max-height: 500px)
         Masque la barre basse, active rail latéral gauche compact 76px + safe-area-left,
         0 % sticky vertical, absorbe les 4 safe-areas (poinçon 90° / 270°).
         ========================================================= */
      html[data-vp='pixel-landscape'] .cf-bottom-nav {
        display: none;
      }

      html[data-vp='pixel-landscape'] .cf-rail {
        position: sticky;
        inset-block-start: 0;
        flex: 0 0 calc(var(--landscape-rail-width) + var(--sim-sal));
        inline-size: calc(var(--landscape-rail-width) + var(--sim-sal));
        block-size: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding-block: calc(10px + var(--sim-sat)) calc(10px + var(--sim-sab));
        padding-inline-start: calc(6px + var(--sim-sal));
        padding-inline-end: 6px;
        background: var(--bg-surface);
        border-inline-end: 1px solid var(--border-subtle);
      }

      html[data-vp='pixel-landscape'] .cf-rail-brand-text,
      html[data-vp='pixel-landscape'] .cf-rail-foot {
        display: none;
      }

      html[data-vp='pixel-landscape'] .cf-rail-nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      html[data-vp='pixel-landscape'] .cf-nav-btn {
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        min-block-size: 48px;
        min-inline-size: 48px;
        padding: 4px 2px;
        border-radius: var(--radius-control);
        font-size: 0.65rem;
      }

      html[data-vp='pixel-landscape'] .cf-nav-btn-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }

      html[data-vp='pixel-landscape'] .cf-nav-btn[aria-current='page'] {
        background: var(--accent-soft);
        box-shadow: none;
      }

      html[data-vp='pixel-landscape'] .cf-nav-badge {
        position: absolute;
        inset-block-start: 2px;
        inset-inline-end: 4px;
      }

      html[data-vp='pixel-landscape'] .cf-main {
        padding-block: calc(12px + var(--sim-sat)) calc(14px + var(--sim-sab));
        padding-inline: 16px calc(16px + var(--sim-sar));
        gap: 12px;
      }

      @media (orientation: landscape) and (max-height: 500px) {
        html[data-vp='fullscreen'] .cf-bottom-nav {
          display: none;
        }

        html[data-vp='fullscreen'] .cf-rail {
          position: sticky;
          inset-block-start: 0;
          flex: 0 0 calc(var(--landscape-rail-width) + var(--sim-sal));
          inline-size: calc(var(--landscape-rail-width) + var(--sim-sal));
          block-size: 100dvh;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          padding-block: calc(10px + var(--sim-sat)) calc(10px + var(--sim-sab));
          padding-inline-start: calc(6px + var(--sim-sal));
          padding-inline-end: 6px;
          background: var(--bg-surface);
          border-inline-end: 1px solid var(--border-subtle);
        }

        html[data-vp='fullscreen'] .cf-rail-brand-text,
        html[data-vp='fullscreen'] .cf-rail-foot {
          display: none;
        }

        html[data-vp='fullscreen'] .cf-rail-nav {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }

        html[data-vp='fullscreen'] .cf-nav-btn {
          flex-direction: column;
          min-block-size: 48px;
          min-inline-size: 48px;
          font-size: 0.65rem;
          border-radius: var(--radius-control);
        }

        html[data-vp='fullscreen'] .cf-nav-btn-inner {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 2px;
        }

        html[data-vp='fullscreen'] .cf-nav-btn[aria-current='page'] {
          background: var(--accent-soft);
          box-shadow: none;
        }

        html[data-vp='fullscreen'] .cf-main {
          padding-block: calc(12px + var(--sim-sat)) calc(14px + var(--sim-sab));
          padding-inline: 16px calc(16px + var(--sim-sar));
          gap: 12px;
        }
      }

      /* =========================================================
         CONTRÔLES, BOUTONS, PILLS INTERACTIVES & FORMULAIRES
         ========================================================= */
      .cf-btn {
        min-block-size: 44px;
        min-inline-size: 44px;
        padding: 8px 14px;
        border-radius: var(--radius-control);
        border: 1px solid var(--border-strong);
        background: var(--bg-surface);
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-size: 0.8125rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
      }

      .cf-btn:hover:not(:disabled) {
        background: var(--bg-hover);
      }

      .cf-btn--primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }

      .cf-btn--primary:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      .cf-btn--danger {
        background: var(--danger);
        border-color: var(--danger);
        color: #ffffff;
      }

      .cf-btn--compact {
        padding: 6px 10px;
        font-size: 0.78rem;
      }

      .cf-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      /* Pilules réservées aux filtres interactifs uniquement (zéro pill statique) */
      .cf-pill-btn {
        min-block-size: 44px;
        min-inline-size: 44px;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid var(--border-strong);
        background: var(--bg-surface);
        color: var(--text-secondary);
        font-family: var(--font-sans);
        font-size: 0.8125rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }

      .cf-pill-btn[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }

      .cf-nav-btn:focus-visible,
      .cf-btn:focus-visible,
      .cf-pill-btn:focus-visible,
      .cf-subtab-btn:focus-visible,
      .cf-tx-row-btn:focus-visible,
      .cf-field-input:focus-visible,
      .cf-range-input:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Header, bandeaux d'état */
      .cf-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .cf-header-title {
        font-size: 1.35rem;
        line-height: 1.2;
      }

      .cf-header-sub {
        color: var(--text-secondary);
        font-size: 0.8125rem;
        margin-block-start: 2px;
      }

      .cf-banner {
        padding: 12px 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .cf-banner--warning {
        background: var(--warning-soft);
        border-color: #e6b87d;
        color: #6d310a;
      }

      .cf-banner--danger {
        background: var(--danger-soft);
        border-color: #f0b4ae;
        color: #7f1d1d;
      }

      .cf-banner--info {
        background: var(--accent-soft);
        border-color: #9ed1c5;
        color: #0b473b;
      }

      /* =========================================================
         GLOBAL FILTER BAR & KPIS (@container)
         ========================================================= */
      .cf-filter-bar {
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .cf-filter-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .cf-filter-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .cf-filter-label {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-muted);
      }

      .cf-kpi-wrap {
        container: kpis / inline-size;
      }

      .cf-kpi-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1px;
        background: var(--border-subtle);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-surface);
        overflow: hidden;
      }

      @container kpis (min-width: 700px) {
        .cf-kpi-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      .cf-kpi-cell {
        background: var(--bg-surface);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-inline-size: 0;
      }

      .cf-kpi-label {
        font-size: 0.75rem;
        color: var(--text-secondary);
        font-weight: 600;
      }

      .cf-kpi-value {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1.2;
      }

      .cf-kpi-meta {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      /* =========================================================
         GRILLES ANALYTIQUES & GRAPHIQUES (@container charts)
         ========================================================= */
      .cf-charts-wrap {
        container: charts / inline-size;
      }

      .cf-charts-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
      }

      @container charts (min-width: 720px) {
        .cf-charts-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .cf-card {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-inline-size: 0;
      }

      .cf-card-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .cf-card-title {
        font-size: 1rem;
      }

      .cf-card-note {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .cf-svg-box {
        inline-size: 100%;
        min-block-size: 210px;
      }

      .cf-svg-box svg {
        display: block;
        inline-size: 100%;
        block-size: auto;
      }

      /* Sankey Desktop-only (>= 1024 px) vs Fallback Mobile (< 1024 px) */
      .cf-sankey-desktop {
        display: none;
      }

      .cf-sankey-mobile-fallback {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      @container app (min-width: 1024px) {
        .cf-sankey-desktop {
          display: block;
        }

        .cf-sankey-mobile-fallback {
          display: none;
        }
      }

      /* Drill-down catégories */
      .cf-bar-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .cf-bar-btn {
        inline-size: 100%;
        min-block-size: 44px;
        padding: 8px 10px;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-control);
        background: var(--bg-surface);
        text-align: start;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .cf-bar-btn:hover {
        background: var(--bg-hover);
      }

      .cf-bar-btn[aria-expanded='true'] {
        border-color: var(--accent);
        background: #f5faf8;
      }

      .cf-bar-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 0.84rem;
      }

      .cf-meter-track {
        position: relative;
        inline-size: 100%;
        block-size: 8px;
        background: var(--bg-subtle);
        border-radius: 999px;
        overflow: hidden;
      }

      .cf-meter-fill {
        block-size: 100%;
        background: var(--accent);
        border-radius: 999px;
      }

      .cf-subcat-drawer {
        padding-inline-start: 14px;
        border-inline-start: 2px solid var(--accent);
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-block: 4px 6px;
      }

      .cf-subcat-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-block-size: 44px;
        padding: 6px 8px;
        border-radius: var(--radius-control);
        border: 0;
        background: transparent;
        cursor: pointer;
        font-family: var(--font-sans);
        font-size: 0.8125rem;
        text-align: start;
        color: var(--text-primary);
      }

      .cf-subcat-line:hover {
        background: var(--bg-subtle);
      }

      /* Simulateur Et si... */
      .cf-slider-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-block: 6px;
        border-block-end: 1px solid var(--border-subtle);
      }

      .cf-slider-row:last-of-type {
        border-block-end: 0;
      }

      .cf-slider-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 0.8125rem;
        font-weight: 600;
      }

      .cf-slider-controls {
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        align-items: center;
        gap: 8px;
      }

      .cf-range-input {
        inline-size: 100%;
        min-block-size: 44px;
        margin: 0;
        accent-color: var(--accent);
        cursor: pointer;
        touch-action: pan-y;
      }

      /* Tableau accessible repliable sous chaque graphique */
      .cf-data-details summary {
        min-block-size: 44px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--accent);
        cursor: pointer;
      }

      .cf-mini-table {
        inline-size: 100%;
        border-collapse: collapse;
        font-size: 0.78rem;
        margin-block-start: 6px;
      }

      .cf-mini-table th,
      .cf-mini-table td {
        padding: 6px 8px;
        border-block-end: 1px solid var(--border-subtle);
        text-align: start;
      }

      .cf-mini-table th.num,
      .cf-mini-table td.num {
        text-align: end;
      }

      /* =========================================================
         BUDGET MONARCH + ROLLOVER + JAUGES WCAG 2.1 AA
         ========================================================= */
      .cf-budget-wrap {
        container: budget / inline-size;
      }

      .cf-budget-summary-eq {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        padding: 14px 16px;
      }

      .cf-pillars-bar {
        display: flex;
        block-size: 12px;
        border-radius: 999px;
        overflow: hidden;
        background: var(--bg-subtle);
      }

      .cf-budget-group summary {
        min-block-size: 48px;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        cursor: pointer;
        font-weight: 700;
        font-family: var(--font-display);
        background: var(--bg-subtle);
        border-block-end: 1px solid var(--border-subtle);
      }

      .cf-budget-row {
        padding: 12px 16px;
        border-block-end: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .cf-budget-row:last-child {
        border-block-end: 0;
      }

      .cf-budget-row-top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .cf-gauge-track {
        position: relative;
        inline-size: 100%;
        block-size: 10px;
        background: var(--bg-subtle);
        border-radius: 999px;
      }

      .cf-gauge-fill {
        block-size: 100%;
        border-radius: 999px;
      }

      .cf-gauge-fill--ok {
        background: var(--accent);
      }

      .cf-gauge-fill--warn {
        background: var(--warning);
      }

      .cf-gauge-fill--over {
        background: var(--danger);
      }

      .cf-pace-marker {
        position: absolute;
        inset-block: -3px;
        inline-size: 2px;
        background: var(--text-primary);
      }

      .cf-status-text {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .cf-status-text--ok {
        color: var(--accent);
      }

      .cf-status-text--warn {
        color: var(--warning);
      }

      .cf-status-text--over {
        color: var(--danger);
      }

      .cf-subbudget-row {
        margin-inline-start: 16px;
        padding: 8px 12px;
        border-inline-start: 2px solid var(--border-strong);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 0.8125rem;
      }

      .cf-year-table-wrap {
        display: none;
        overflow-x: auto;
      }

      .cf-year-cards-mobile {
        display: flex;
        flex-direction: column;
      }

      @container app (min-width: 1024px) {
        .cf-year-table-wrap {
          display: block;
        }

        .cf-year-cards-mobile {
          display: none;
        }
      }

      /* =========================================================
         RÉCURRENTS & CALENDRIER (Budget > Récurrents & Calendrier)
         ========================================================= */
      .cf-rec-wrap {
        container: rec / inline-size;
      }

      .cf-rec-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
      }

      @container rec (min-width: 720px) {
        .cf-rec-grid {
          grid-template-columns: minmax(320px, 1.05fr) minmax(0, 1fr);
          align-items: start;
        }
      }

      .cf-cal-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 4px;
      }

      .cf-cal-weekday {
        text-align: center;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--text-muted);
        padding-block: 4px;
      }

      .cf-cal-day {
        min-block-size: 44px;
        min-inline-size: 44px;
        padding: 4px 2px;
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        background: var(--bg-surface);
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-size: 0.75rem;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
      }

      .cf-cal-day:hover {
        background: var(--bg-hover);
      }

      .cf-cal-day:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .cf-cal-day[aria-pressed='true'] {
        border-color: var(--accent);
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 1px var(--accent);
      }

      .cf-cal-day--today {
        border-color: var(--text-primary);
        font-weight: 700;
      }

      .cf-cal-day--empty {
        min-block-size: 44px;
      }

      .cf-cal-marker {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 0.65rem;
        font-weight: 700;
        line-height: 1.1;
        color: var(--accent);
      }

      .cf-cal-marker--warn {
        color: var(--warning);
      }

      .cf-switch-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-block-size: 44px;
        padding: 6px 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--bg-surface);
        cursor: pointer;
        font-size: 0.8125rem;
        font-weight: 600;
      }

      @container app (max-width: 360px) {
        .cf-main {
          padding-inline: 4px;
        }

        .cf-cal-card {
          padding: 10px 0;
          border-inline: 0;
          border-radius: 0;
        }

        .cf-cal-grid {
          gap: 0;
        }

        .cf-cal-day {
          border-radius: 4px;
          font-size: 0.7rem;
          padding: 2px 1px;
        }
      }

      /* =========================================================
         TRANSACTIONS : SOUS-ONGLETS, GRAND LIVRE & CATÉGORIES
         ========================================================= */
      .cf-subtabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 4px;
        background: var(--bg-subtle);
        border-radius: var(--radius-control);
        border: 1px solid var(--border-subtle);
      }

      .cf-subtab-btn {
        min-block-size: 44px;
        min-inline-size: 44px;
        padding: 6px 14px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text-secondary);
        font-family: var(--font-sans);
        font-size: 0.8125rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .cf-subtab-btn[aria-selected='true'] {
        background: var(--bg-surface);
        color: var(--text-primary);
        box-shadow: 0 1px 2px rgba(20, 23, 26, 0.08);
      }

      .cf-ledger-wrap {
        container: ledger / inline-size;
      }

      .cf-ledger-table-wrap {
        display: none;
      }

      .cf-ledger-list-mobile {
        display: flex;
        flex-direction: column;
      }

      @container ledger (min-width: 720px) {
        .cf-ledger-table-wrap {
          display: block;
          overflow-x: auto;
        }

        .cf-ledger-list-mobile {
          display: none;
        }
      }

      .cf-ledger-table {
        inline-size: 100%;
        border-collapse: collapse;
        font-size: 0.8125rem;
      }

      .cf-ledger-table th {
        text-align: start;
        padding: 10px 12px;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-muted);
        border-block-end: 1px solid var(--border-subtle);
        white-space: nowrap;
      }

      .cf-ledger-table th.num,
      .cf-ledger-table td.num {
        text-align: end;
      }

      .cf-ledger-table tbody tr {
        cursor: pointer;
        border-block-end: 1px solid var(--border-subtle);
      }

      .cf-ledger-table tbody tr:hover {
        background: var(--bg-hover);
      }

      .cf-ledger-table td {
        padding: 10px 12px;
        vertical-align: middle;
      }

      .cf-tx-deferred {
        content-visibility: auto;
        contain-intrinsic-size: auto 68px;
      }

      .cf-tx-row-btn {
        inline-size: 100%;
        min-block-size: 64px;
        padding: 12px 14px;
        border: 0;
        border-block-end: 1px solid var(--border-subtle);
        background: var(--bg-surface);
        text-align: start;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .cf-tx-row-btn:last-child {
        border-block-end: 0;
      }

      .cf-tx-row-btn:hover {
        background: var(--bg-hover);
      }

      .cf-tx-row-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .cf-tx-row-sub {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 0.75rem;
        color: var(--text-secondary);
      }

      .cf-amount-pos {
        color: var(--accent);
      }

      .cf-amount-muted {
        color: var(--text-muted);
      }

      /* Validation post-interaction (:user-invalid / :has()) */
      .cf-field-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .cf-field-label {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .cf-field-input {
        min-block-size: 44px;
        padding: 8px 12px;
        border-radius: var(--radius-control);
        border: 1px solid var(--border-strong);
        background: var(--bg-surface);
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-size: 0.875rem;
      }

      .cf-field-error {
        display: none;
        color: var(--danger);
        font-size: 0.78rem;
        font-weight: 600;
      }

      .cf-field-group:has(:is(:user-invalid, .user-invalid-fallback)) .cf-field-input {
        border-color: var(--danger);
        background: var(--danger-soft);
      }

      .cf-field-group:has(:is(:user-invalid, .user-invalid-fallback)) .cf-field-error {
        display: block;
      }

      /* =========================================================
         SQUELETTES ANTI-CLS (ÉTAT SYNCHRO / IA EN COURS)
         ========================================================= */
      @keyframes cf-shimmer {
        0% {
          opacity: 0.55;
        }
        50% {
          opacity: 0.95;
        }
        100% {
          opacity: 0.55;
        }
      }

      .cf-skeleton {
        background: var(--bg-subtle);
        border-radius: 6px;
        animation: cf-shimmer 1.4s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .cf-skeleton {
          animation: none;
          opacity: 0.75;
        }
      }

      /* =========================================================
         DIALOG NATIF (.showModal()) & POPOVER NATIF ([popover])
         ========================================================= */
      dialog.cf-dialog {
        border: 1px solid var(--border-subtle);
        background: var(--bg-surface);
        color: var(--text-primary);
        padding: 0;
        margin: 0;
        max-inline-size: 100dvw;
        max-block-size: 100dvh;
      }

      dialog.cf-dialog:modal {
        overscroll-behavior: contain;
      }

      dialog.cf-dialog::backdrop {
        background: rgba(20, 23, 26, 0.45);
        overflow: hidden;
        overscroll-behavior: contain;
      }

      /* Portrait Mobile : Bottom Sheet */
      html[data-vp='pixel-portrait'] dialog.cf-dialog,
      html[data-vp='mobile-320'] dialog.cf-dialog,
      html[data-vp='fullscreen'] dialog.cf-dialog {
        position: fixed;
        inset-block-start: auto;
        inset-block-end: 0;
        inset-inline: 0;
        margin-inline: auto;
        inline-size: min(440px, 100dvw);
        max-block-size: 86dvh;
        border-radius: 16px 16px 0 0;
        padding-block-end: var(--sim-sab);
      }

      /* Desktop : Panneau latéral droit ou Modale centrée */
      html[data-vp='desktop'] dialog.cf-dialog.cf-dialog--drawer {
        position: fixed;
        inset-block: 0;
        inset-inline-start: auto;
        inset-inline-end: 0;
        inline-size: 420px;
        block-size: 100dvh;
        border-radius: 14px 0 0 14px;
      }

      html[data-vp='desktop'] dialog.cf-dialog.cf-dialog--modal {
        position: fixed;
        inset: 0;
        margin: auto;
        inline-size: min(540px, calc(100dvw - 32px));
        max-block-size: 88dvh;
        border-radius: 14px;
      }

      /* Pixel 8 Paysage (et compact landscape) : TOUJOURS panneau latéral droit + absorption safe-area-right */
      html[data-vp='pixel-landscape'] dialog.cf-dialog {
        position: fixed;
        inset-block: 0;
        inset-inline-start: auto;
        inset-inline-end: 0;
        inline-size: min(420px, 88dvw);
        block-size: 100dvh;
        border-radius: 14px 0 0 14px;
        padding-inline-end: var(--sim-sar);
        padding-block-end: var(--sim-sab);
      }

      @media (min-width: 1024px) {
        html[data-vp='fullscreen'] dialog.cf-dialog.cf-dialog--drawer {
          inset-block: 0;
          inset-inline-start: auto;
          inset-inline-end: 0;
          inline-size: 420px;
          block-size: 100dvh;
          border-radius: 14px 0 0 14px;
        }

        html[data-vp='fullscreen'] dialog.cf-dialog.cf-dialog--modal {
          inset: 0;
          margin: auto;
          inline-size: min(540px, calc(100dvw - 32px));
          max-block-size: 88dvh;
          border-radius: 14px;
        }
      }

      @media (orientation: landscape) and (max-height: 500px) {
        html[data-vp='fullscreen'] dialog.cf-dialog {
          inset-block: 0;
          inset-inline-start: auto;
          inset-inline-end: 0;
          inline-size: min(420px, 88dvw);
          block-size: 100dvh;
          border-radius: 14px 0 0 14px;
          padding-inline-end: var(--sim-sar);
          padding-block-end: var(--sim-sab);
        }
      }

      .cf-dialog-inner {
        display: flex;
        flex-direction: column;
        block-size: 100%;
        max-block-size: inherit;
        overflow-y: auto;
        padding: 18px 20px;
        gap: 14px;
      }

      .cf-dialog-head {

        /* =========================================================

        function toEurCents(amountCents, currency) {
          if (currency === 'EUR') return amountCents;
          return Math.round((amountCents * FX_USD_TO_EUR_MICRO) / 1000000);
        }

        function formatMoney(cents, currency, signed) {
          const val = (cents / 100);
          const absFormatted = new Intl.NumberFormat('fr-FR', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          }).format(Math.abs(val));
          const prefix = cents < 0 ? '−' : signed && cents > 0 ? '+' : '';
          return currency === 'USD' ? prefix + '$' + absFormatted : prefix + absFormatted + ' €';
        }

        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

          const cat = state.categories.find((c) => c.id === catId);
          if (!cat) return { catName: 'Non catégorisé', subName: '' };
          const sub = cat.children.find((s) => s.id === subId);
          return { catName: cat.name, subName: sub ? sub.name : '' };
        }

        function updateScale() {
          const wrap = document.getElementById('sim-device-wrap');
          const stage = document.querySelector('.sim-stage');
          if (!wrap || !stage) return;
          if (state.vp === 'fullscreen') {
            document.documentElement.style.setProperty('--sim-scale', '1');
            wrap.style.height = 'auto';
            return;
          }
          const targetW =
            state.vp === 'desktop'
              ? 1440
              : state.vp === 'pixel-portrait'
              ? 412
              : state.vp === 'pixel-landscape'
              ? 915
              : 320;
          const targetH =
            state.vp === 'desktop'
              ? 900
              : state.vp === 'pixel-portrait'
              ? 915
              : state.vp === 'pixel-landscape'
              ? 412
              : 568;
          const availW = Math.max(300, window.innerWidth - 36);
          const scale = Math.min(1, availW / targetW);
          document.documentElement.style.setProperty('--sim-scale', scale.toFixed(4));
          wrap.style.height = Math.round(targetH * scale) + 'px';
        }

        /* =========================================================
           CALCULS AGRÉGATS FILTRÉS (SYNTHÈSE + PROJECTION)
           ========================================================= */
        function getFilteredTransactions() {
          return state.transactions.filter((tx) => {
            if (state.currencyMode === 'USD' && tx.currency !== 'USD') return false;
            if (state.scope === 'BoursoBank' && tx.bank !== 'BoursoBank') return false;
            if (state.scope === 'Revolut' && tx.bank !== 'Revolut') return false;
            if (state.scope === 'acc-r2' && tx.accountId !== 'acc-r2') return false;
            if (state.txSearch.trim()) {
              const q = state.txSearch.trim().toLowerCase();
              const names = getCategoryNames(tx.catId, tx.subId);
              const hay = (tx.merchant + ' ' + tx.note + ' ' + names.catName + ' ' + names.subName).toLowerCase();
              if (!hay.includes(q)) return false;
            }
            return true;
          });
        }

        function computeKpis() {
          const cur = state.currencyMode;
          const periodMult = state.period === '1M' ? 1 : state.period === '3M' ? 3 : state.period === '6M' ? 6 : 12;

          let consolidatedBalance = 0;
          ACCOUNTS.forEach((a) => {
            if (cur === 'USD' && a.currency !== 'USD') return;
            if (state.scope === 'BoursoBank' && a.bank !== 'BoursoBank') return;
            if (state.scope === 'Revolut' && a.bank !== 'Revolut') return;
            if (state.scope === 'acc-r2' && a.id !== 'acc-r2') return;
            consolidatedBalance += cur === 'USD' ? a.balanceCents : toEurCents(a.balanceCents, a.currency);
          });

          const txs = getFilteredTransactions();
          let revMonth = 0;
          let expMonth = 0;
          let transferVol = 0;
          txs.forEach((tx) => {
            const val = cur === 'USD' ? tx.amountCents : toEurCents(tx.amountCents, tx.currency);
            if (tx.isTransfer) {
              transferVol += Math.abs(val);
            } else if (val > 0) {
              revMonth += val;
            } else {
              expMonth += Math.abs(val);
            }
          });

          const totalRev = revMonth * periodMult;
          const totalExp = expMonth * periodMult;
          const savingsRate = totalRev > 0 ? Math.round(((totalRev - totalExp) / totalRev) * 1000) / 10 : 0;

          return {
            cur,
            consolidatedBalance,
            totalRev,
            totalExp,
            transferVol,
            savingsRate,
            netSaved: totalRev - totalExp,
          };
        }

        /* =========================================================

        function renderBalanceAndCompareSvg(cur) {
          const labels =
            state.period === '1M'
              ? ['01/11', '06/11', '11/11', '16/11', '21/11', '26/11']
              : ['Juin', 'Juil.', 'Août', 'Sept.', 'Oct.', 'Nov.'];
          const mult = cur === 'USD' ? 0.23 : 1;
          const balances = [8920, 9450, 9180, 10120, 10690, 11432].map((v) => Math.round(v * mult));
          const maxVal = Math.max(...balances) * 1.1;
          const minVal = Math.min(...balances) * 0.85;
          const w = 520;
          const h = 195;
          const padL = 56;
          const padR = 16;
          const padT = 16;
          const padB = 30;
          const pw = w - padL - padR;
          const ph = h - padT - padB;

          const pts = balances.map((v, i) => {
            const x = padL + (i * pw) / (balances.length - 1);
            const y = padT + ph - ((v - minVal) / (maxVal - minVal || 1)) * ph;
            return { x, y, v, label: labels[i] };
          });

          const linePath = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
          const areaPath =
            linePath +
            ' L' +
            pts[pts.length - 1].x.toFixed(1) +
            ',' +
            (padT + ph) +
            ' L' +
            pts[0].x.toFixed(1) +
            ',' +
            (padT + ph) +
            ' Z';

          const unit = cur === 'USD' ? '$' : '€';
          return `
            <svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Évolution du solde cumulé">
              <defs>
                <linearGradient id="balGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#0f5c4d" stop-opacity="0.22" />

              <line x1="${padL}" y1="${padT}" x2="${w - padR}" y2="${padT}" stroke="#dedad0" stroke-dasharray="3 3" />
              <line x1="${padL}" y1="${padT + ph / 2}" x2="${w - padR}" y2="${padT + ph / 2}" stroke="#dedad0" stroke-dasharray="3 3" />
              <line x1="${padL}" y1="${padT + ph}" x2="${w - padR}" y2="${padT + ph}" stroke="#c2bdb0" />
              <text x="${padL - 8}" y="${padT + 4}" text-anchor="end" font-size="10.5" fill="#5c646e" font-family="JetBrains Mono, monospace">${Math.round(maxVal)} ${unit}</text>
              <text x="${padL - 8}" y="${padT + ph / 2 + 4}" text-anchor="end" font-size="10.5" fill="#5c646e" font-family="JetBrains Mono, monospace">${Math.round((maxVal + minVal) / 2)} ${unit}</text>
              <text x="${padL - 8}" y="${padT + ph + 4}" text-anchor="end" font-size="10.5" fill="#5c646e" font-family="JetBrains Mono, monospace">${Math.round(minVal)} ${unit}</text>
              <path d="${areaPath}" fill="url(#balGrad)" />
              <path d="${linePath}" fill="none" stroke="#0f5c4d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
              ${pts
                .map(
                  (p) => `
                  <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#ffffff" stroke="#0f5c4d" stroke-width="2.2">
                    <title>${p.label} : ${p.v} ${unit}</title>
                  </circle>
                  <text x="${p.x.toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="10.5" fill="#4a515a">${p.label}</text>
                `
                )
                .join('')}
            </svg>
          `;
        }

        function computeProjectionSeries() {
          const kpis = computeKpis();
          const start = kpis.consolidatedBalance;
          const monthlyBaseNet = Math.round((kpis.totalRev - kpis.totalExp) / (state.period === '1M' ? 1 : state.period === '3M' ? 3 : state.period === '6M' ? 6 : 12));
          const varMonthlyImpact = Math.round((85900 * -state.whatIf.varDeltaPct) / 100);
          const extraIncomeCents = state.whatIf.extraIncomeEur * 100;
          const oneOffCents = state.whatIf.oneOffEur * 100;
          const netMonthlySim = monthlyBaseNet + varMonthlyImpact + extraIncomeCents;

          const points = [];
          for (let m = 0; m <= state.horizonMonths; m++) {
            const oneOff = m >= 1 ? oneOffCents : 0;
            const trend = start + m * netMonthlySim - oneOff;
            const spread = m * 14000;
            points.push({
              m,
              label: m === 0 ? 'Auj.' : '+' + m + 'M',
              trend,
              prudent: trend - spread,
              optimiste: trend + spread,
            });
          }
          return { points, netMonthlySim };
        }

        function renderProjectionSvg(cur) {
          const { points } = computeProjectionSeries();
          const allVals = points.flatMap((p) => [p.prudent, p.optimiste]);
          const minVal = Math.min(...allVals) * 0.92;
          const maxVal = Math.max(...allVals) * 1.04;
          const w = 520;
          const h = 195;
          const padL = 64;
          const padR = 16;
          const padT = 16;
          const padB = 30;
          const pw = w - padL - padR;
          const ph = h - padT - padB;

          const mapPt = (val, i) => ({
            x: padL + (i * pw) / (points.length - 1),
            y: padT + ph - ((val - minVal) / (maxVal - minVal || 1)) * ph,
          });

          const trendPts = points.map((p, i) => mapPt(p.trend, i));
          const optPts = points.map((p, i) => mapPt(p.optimiste, i));
          const pruPts = points.map((p, i) => mapPt(p.prudent, i));

          const bandPath =
            optPts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ') +
            ' ' +
            pruPts
              .slice()
              .reverse()
              .map((p) => 'L' + p.x.toFixed(1) + ',' + p.y.toFixed(1))
              .join(' ') +
            ' Z';

          const trendPath = trendPts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');

          return `
            <svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Projection de solde sur ${state.horizonMonths} mois avec bande prudent et optimiste">
              <line x1="${padL}" y1="${padT}" x2="${w - padR}" y2="${padT}" stroke="#dedad0" stroke-dasharray="3 3" />
              <line x1="${padL}" y1="${padT + ph}" x2="${w - padR}" y2="${padT + ph}" stroke="#c2bdb0" />
              <text x="${padL - 8}" y="${padT + 4}" text-anchor="end" font-size="10.5" fill="#5c646e" font-family="JetBrains Mono, monospace">${formatMoney(Math.round(maxVal), cur, false)}</text>
              <text x="${padL - 8}" y="${padT + ph + 4}" text-anchor="end" font-size="10.5" fill="#5c646e" font-family="JetBrains Mono, monospace">${formatMoney(Math.round(minVal), cur, false)}</text>
              <path d="${bandPath}" fill="#0f5c4d" fill-opacity="0.14" />
              <path d="${trendPath}" fill="none" stroke="#0f5c4d" stroke-width="2.6" stroke-linecap="round" />
              ${points
                .filter((_, i) => i === 0 || i === points.length - 1 || i % Math.ceil(points.length / 4) === 0)
                .map((p) => {
                  const pt = mapPt(p.trend, p.m);
                  return `
                    <circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3.8" fill="#ffffff" stroke="#0f5c4d" stroke-width="2" />
                    <text x="${pt.x.toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="10.5" fill="#4a515a">${p.label}</text>
                  `;
                })
                .join('')}
            </svg>
          `;
        }

        /* =========================================================
           ONGLET 2 : BUDGET MONARCH + ROLLOVER + RÉCURRENTS & CALENDRIER
           ========================================================= */
        function getSmoothedMonthlyEurCents(series) {
          const baseEur = series.currency === 'USD' ? toEurCents(series.expectedAmountCents, 'USD') : series.expectedAmountCents;
          if (series.cadence === 'weekly') return Math.round((baseEur * 52) / 12);
          if (series.cadence === 'quarterly') return Math.round(baseEur / 3);
          if (series.cadence === 'yearly') return Math.round(baseEur / 12);
          return baseEur;
        }

        function getRecurringMonthData(monthKey) {
          const parts = monthKey.split('-');
          const year = Number(parts[0]);
          const monthNum = Number(parts[1]);
          const daysInMonth = new Date(year, monthNum, 0).getDate();
          const todayDay = monthKey === '2026-10' ? 32 : monthKey === '2026-11' ? 26 : 0;

          const activeSeries = state.recurring.filter((s) => {
            if (s.status === 'dismissed') return false;
            if (s.direction === 'income' && !state.includeRecurringIncome) return false;
            return true;
          });

          const occurrences = [];
          activeSeries.forEach((s) => {
            if (s.status === 'cancelled') {
              occurrences.push({
                series: s,
                day: Math.min(s.billingDay, daysInMonth),
                dateStr: String(Math.min(s.billingDay, daysInMonth)).padStart(2, '0') + '/' + String(monthNum).padStart(2, '0') + '/' + year,
                occStatus: 'cancelled',
                eurCents: s.currency === 'USD' ? toEurCents(s.expectedAmountCents, 'USD') : s.expectedAmountCents,
              });
              return;
            }
            if (s.cadence === 'yearly' && Array.isArray(s.activeMonths) && !s.activeMonths.includes(monthNum)) return;
            if (s.cadence === 'quarterly' && Array.isArray(s.activeMonths) && !s.activeMonths.includes(monthNum)) return;

            const days = [];
            if (s.cadence === 'weekly') {
              let d = ((s.billingDay - 1) % 7) + 1;
              while (d <= daysInMonth) {
                days.push(d);
                d += 7;
              }
            } else {
              days.push(Math.min(s.billingDay, daysInMonth));
            }

            days.forEach((d) => {
              occurrences.push({
                series: s,
                day: d,
                dateStr: String(d).padStart(2, '0') + '/' + String(monthNum).padStart(2, '0') + '/' + year,
                occStatus: d <= todayDay ? 'paid' : 'upcoming',
                eurCents: s.currency === 'USD' ? toEurCents(s.expectedAmountCents, 'USD') : s.expectedAmountCents,
              });
            });
          });

          occurrences.sort((a, b) => a.day - b.day || a.series.merchant.localeCompare(b.series.merchant));

          let smoothedExpenseCents = 0;
          let annualQuarterlyPartCents = 0;
          let smoothedIncomeCents = 0;
          activeSeries.forEach((s) => {
            if (s.status === 'cancelled') return;
            const sm = getSmoothedMonthlyEurCents(s);
            if (s.direction === 'income') {
              smoothedIncomeCents += sm;
            } else {
              smoothedExpenseCents += sm;
              if (s.cadence === 'yearly' || s.cadence === 'quarterly') {
                annualQuarterlyPartCents += sm;
              }
            }
          });

          let paidExpenseCents = 0;
          let remainingExpenseCents = 0;
          let paidIncomeCents = 0;
          let remainingIncomeCents = 0;
          occurrences.forEach((o) => {
            if (o.occStatus === 'cancelled') return;
            if (o.series.direction === 'income') {
              if (o.occStatus === 'paid') paidIncomeCents += o.eurCents;
              else remainingIncomeCents += o.eurCents;
            } else {
              if (o.occStatus === 'paid') paidExpenseCents += o.eurCents;
              else remainingExpenseCents += o.eurCents;
            }
          });

          return {
            year,
            monthNum,
            daysInMonth,
            todayDay,
            occurrences,
            smoothedExpenseCents,
            annualQuarterlyPartCents,
            smoothedIncomeCents,
            paidExpenseCents,
            remainingExpenseCents,
            paidIncomeCents,
            remainingIncomeCents,
          };
        }

        function renderRecurringCalendarSubtab(months, mLabels, idx, offlineAttr) {

            ${

                          () => `

                `
                : `

              </div>
            </section>

            <!-- Grille adaptative Calendrier (7 cols) + Liste chronologique -->
            <div class="cf-rec-wrap">
              <div class="cf-rec-grid">
                <section class="cf-surface cf-card cf-cal-card" aria-label="Calendrier des échéances">
                  <div class="cf-card-head" style="padding-inline:12px;">
                    <h2 class="cf-card-title">Calendrier ${mLabels[state.budgetMonth]}</h2>
                    ${
                      state.selectedRecDay

                    ${Array.from({ length: firstWeekday }).map(() => '<div class="cf-cal-day--empty" aria-hidden="true"></div>').join('')}
                    ${Array.from({ length: data.daysInMonth })
                      .map((_, i) => {
                        const day = i + 1;

                        const expSum = dayOcc.filter((o) => o.series.direction === 'expense').reduce((acc, o) => acc + o.eurCents, 0);

                              <div style="padding-block:10px;border-block-start:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:6px;${isCancelled ? 'opacity:0.65;' : ''}">
                                <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
                                  <div>
                                    <strong>${escapeHtml(s.merchant)}</strong>
                                    <div style="font-size:0.75rem;color:var(--text-secondary);">
                                      ${cadLabels[s.cadence] || 'Mensuel'} · ${o.dateStr} · <strong>${statusText}</strong>${extraBadges.length ? ' · ' + extraBadges.join(' · ') : ''}
                                    </div>
                                  </div>
                                  <div class="tabular-amount ${isInc ? 'cf-amount-pos' : ''}" style="text-align:end;">
                                    <strong>${formatMoney(isInc ? s.expectedAmountCents : -s.expectedAmountCents, s.currency, isInc)}</strong>
                                    ${s.currency === 'USD' ? `<div style="font-size:0.72rem;color:var(--text-muted);">≈ ${formatMoney(isInc ? o.eurCents : -o.eurCents, 'EUR', isInc)}</div>` : ''}
                                  </div>
                                </div>
                                <div style="display:flex;flex-wrap:wrap;gap:6px;">
                                  ${
                                    s.status === 'detected' && !isCancelled
                                      ? `<button type="button" class="cf-btn cf-btn--primary cf-btn--compact" data-rec-action="confirm:${s.id}" ${offlineAttr}>Confirmer</button>`
                                      : ''
                                  }
                                  <button type="button" class="cf-btn cf-btn--compact" data-rec-action="adjust:${s.id}" ${offlineAttr}>Ajuster</button>
                                  ${
                                    !isCancelled
                                      ? `<button type="button" class="cf-btn cf-btn--compact" data-rec-action="cancel:${s.id}" ${offlineAttr}>Résilier</button>`
                                      : ''
                                  }
                                  <button type="button" class="cf-btn cf-btn--compact" data-rec-action="dismiss:${s.id}" ${offlineAttr}>Ignorer</button>
                                </div>
                              </div>
                            `;
                          })
                          .join('')
                  }
                </section>
              </div>
            </div>
            `
            }
          `;
        }

        function renderBudgetTab() {
          const months = ['2026-10', '2026-11', '2026-12'];
          const mLabels = { '2026-10': 'Oct. 2026', '2026-11': 'Nov. 2026', '2026-12': 'Déc. 2026' };
          const idx = months.indexOf(state.budgetMonth);
          const offlineAttr = isOffline() ? 'disabled title="Connexion requise"' : '';

          const headerSubtabs = `
            <header class="cf-header">
              <div>
                <h1 class="cf-header-title">Budget Monarch &amp; Récurrents</h1>
                <p class="cf-header-sub">Enveloppes par catégorie, rollover multi-mois et calendrier des prélèvements</p>
              </div>
              ${
                state.budgetSubtab === 'plan'
                  ? `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
                      <div style="display:inline-flex;align-items:center;gap:4px;">
                        <button type="button" class="cf-btn cf-btn--compact" data-budget-month="${months[Math.max(0, idx - 1)]}" ${idx === 0 ? 'disabled' : ''} aria-label="Mois précédent">&lt;</button>
                        <span class="tabular-amount" style="padding-inline:8px;font-weight:700;">${mLabels[state.budgetMonth]}</span>
                        <button type="button" class="cf-btn cf-btn--compact" data-budget-month="${months[Math.min(months.length - 1, idx + 1)]}" ${idx === months.length - 1 ? 'disabled' : ''} aria-label="Mois suivant">&gt;</button>
                      </div>
                      <button type="button" class="cf-pill-btn" data-budget-view="month" aria-pressed="${state.budgetView === 'month'}">Vue Mois</button>
                      <button type="button" class="cf-pill-btn" data-budget-view="year" aria-pressed="${state.budgetView === 'year'}">Vue Année (12 mois)</button>
                    </div>`
                  : ''
              }
            </header>

            <div class="cf-subtabs" role="tablist" aria-label="Sous-sections Budget">
              <button type="button" role="tab" class="cf-subtab-btn" data-budget-sub="plan" aria-selected="${state.budgetSubtab === 'plan'}">Plan budgétaire</button>
              <button type="button" role="tab" class="cf-subtab-btn" data-budget-sub="recurring" aria-selected="${state.budgetSubtab === 'recurring'}">Récurrents &amp; Calendrier</button>
            </div>
          `;

          if (state.budgetSubtab === 'recurring') {
            return headerSubtabs + renderRecurringCalendarSubtab(months, mLabels, idx, offlineAttr);
          }

          const plan = state.budgets[state.budgetMonth];
          const pacePct = state.budgetMonth === '2026-11' ? 87 : state.budgetMonth === '2026-10' ? 100 : 8;

          let totalPlanned = 0;
          let totalActual = 0;
          const groupTotals = { 'Charges fixes': { p: 0, a: 0 }, 'Dépenses variables': { p: 0, a: 0 }, 'Non-mensuelles': { p: 0, a: 0 } };

          state.categories.forEach((c) => {
            const item = plan.items[c.id];
            if (!item || !groupTotals[c.group]) return;
            totalPlanned += item.limitCents;
            totalActual += item.actualCents;
            groupTotals[c.group].p += item.limitCents;
            groupTotals[c.group].a += item.actualCents;
          });

          const leftPlanned = plan.incomePlannedCents - totalPlanned;
          const leftActual = 422300 - totalActual;

          const fixesPct = totalPlanned ? Math.round((groupTotals['Charges fixes'].p / totalPlanned) * 100) : 0;
          const varPct = totalPlanned ? Math.round((groupTotals['Dépenses variables'].p / totalPlanned) * 100) : 0;
          const nonPct = Math.max(0, 100 - fixesPct - varPct);

          return (
            headerSubtabs +
            `
            <!-- Bandeau Revenus - Dépenses = Reste à épargner -->
            <section class="cf-surface cf-budget-summary-eq" aria-label="Équation budgétaire">
              <div>
                <div class="cf-kpi-label">Revenus prévus</div>
                <div class="cf-kpi-value cf-amount-pos">${formatMoney(plan.incomePlannedCents, 'EUR', false)}</div>
              </div>
              <div>
                <div class="cf-kpi-label">Budget dépenses prévu</div>
                <div class="cf-kpi-value">${formatMoney(totalPlanned, 'EUR', false)}</div>
                <div class="cf-kpi-meta tabular-amount">Réel : ${formatMoney(totalActual, 'EUR', false)}</div>
              </div>
              <div>
                <div class="cf-kpi-label">Reste à épargner (Prévu vs Réel)</div>
                <div class="cf-kpi-value cf-amount-pos">${formatMoney(leftPlanned, 'EUR', false)}</div>
                <div class="cf-kpi-meta tabular-amount">Réel à date : ${formatMoney(leftActual, 'EUR', false)}</div>
              </div>
            </section>

            <!-- Répartition Fixes / Variables / Non-mensuelles -->
            <section class="cf-surface cf-card">
              <div class="cf-card-head">
                <h2 class="cf-card-title">Répartition par piliers</h2>
                <span class="cf-card-note tabular-amount">Rythme du mois : ${pacePct} %</span>
              </div>
              <div class="cf-pillars-bar" aria-hidden="true">
                <div style="inline-size:${fixesPct}%;background:#1f4e45;"></div>
                <div style="inline-size:${varPct}%;background:#92400e;"></div>
                <div style="inline-size:${nonPct}%;background:#b42318;"></div>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:14px;font-size:0.8125rem;">
                <span>■ Charges fixes : <strong class="tabular-amount">${fixesPct} % (${formatMoney(groupTotals['Charges fixes'].p, 'EUR', false)})</strong></span>
                <span>■ Dépenses variables : <strong class="tabular-amount">${varPct} % (${formatMoney(groupTotals['Dépenses variables'].p, 'EUR', false)})</strong></span>
                <span>■ Non-mensuelles : <strong class="tabular-amount">${nonPct} % (${formatMoney(groupTotals['Non-mensuelles'].p, 'EUR', false)})</strong></span>
              </div>
            </section>

            ${
              state.budgetView === 'year'
                ? renderBudgetYearView()
                : ['Charges fixes', 'Dépenses variables', 'Non-mensuelles']
                    .map((groupName) => {
                      const cats = state.categories.filter((c) => c.group === groupName && plan.items[c.id]);
                      return `
                        <details class="cf-surface cf-budget-group" open>
                          <summary>
                            <span>${groupName}</span>
                            <span class="tabular-amount">${formatMoney(groupTotals[groupName].a, 'EUR', false)} / ${formatMoney(groupTotals[groupName].p, 'EUR', false)}</span>
                          </summary>
                          <div>
                            ${cats
                              .map((c) => {
                                const it = plan.items[c.id];
                                const available = it.limitCents + (it.rollover ? it.carryInCents : 0);
                                const pct = available > 0 ? Math.round((it.actualCents / available) * 100) : 0;
                                const tier = pct >= 100 ? 'over' : pct >= 80 ? 'warn' : 'ok';
                                const statusLabel =
                                  tier === 'over'
                                    ? '✕ Dépassement (' + pct + ' %)'
                                    : tier === 'warn'
                                    ? '▲ Vigilance (' + pct + ' %)'
                                    : '✓ Maîtrisé (' + pct + ' %)';
                                const remaining = available - it.actualCents;

                                return `
                                  <div class="cf-budget-row">
                                    <div class="cf-budget-row-top">
                                      <div>
                                        <strong>${escapeHtml(c.name)}</strong>
                                        ${it.overrideMonth ? '<span style="font-size:0.75rem;color:var(--warning);margin-inline-start:6px;">• Exception ce mois</span>' : ''}
                                      </div>
                                      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">
                                        ${
                                          it.rollover && it.carryInCents !== 0
                                            ? `<button type="button" class="cf-btn cf-btn--compact" data-open-rollover="${c.id}">
                                                <span class="tabular-amount">${formatMoney(it.carryInCents, 'EUR', true)} reportés</span>
                                              </button>`
                                            : ''
                                        }
                                        <span class="tabular-amount" style="font-weight:700;">${formatMoney(it.actualCents, 'EUR', false)} / ${formatMoney(available, 'EUR', false)}</span>
                                        <button type="button" class="cf-btn cf-btn--compact" data-edit-budget="${c.id}" ${offlineAttr}>
                                          ${isOffline() ? 'Connexion requise' : 'Éditer'}
                                        </button>
                                      </div>
                                    </div>
                                    <div class="cf-gauge-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100, pct)}" aria-label="${escapeHtml(c.name)}">
                                      <div class="cf-gauge-fill cf-gauge-fill--${tier}" style="inline-size:${Math.min(100, pct)}%;"></div>
                                      <div class="cf-pace-marker" style="inset-inline-start:${pacePct}%;" aria-hidden="true" title="Rythme du mois : ${pacePct} %"></div>
                                    </div>
                                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:0.78rem;">
                                      <span class="cf-status-text cf-status-text--${tier}">${statusLabel}</span>
                                      <span class="tabular-amount" style="color:var(--text-secondary);">
                                        ${remaining >= 0 ? 'Reste : ' + formatMoney(remaining, 'EUR', false) : 'Dépassement : ' + formatMoney(-remaining, 'EUR', false)}
                                      </span>
                                    </div>
                                    ${
                                      it.subCap
                                        ? (() => {
                                            const sc = it.subCap;
                                            const sPct = Math.round((sc.actualCents / sc.limitCents) * 100);
                                            const sTier = sPct >= 100 ? 'over' : sPct >= 80 ? 'warn' : 'ok';
                                            return `
                                              <div class="cf-subbudget-row">
                                                <div>
                                                  <strong>Sous-plafond · Restaurants &amp; Cafés</strong>
                                                  <div style="font-size:0.72rem;color:var(--text-muted);">Inclus dans l’enveloppe Alimentation (sans double-comptage)</div>
                                                </div>
                                                <div style="display:flex;align-items:center;gap:10px;">
                                                  <span class="cf-status-text cf-status-text--${sTier}">${sTier === 'over' ? '✕ Dépassement' : '✓ Maîtrisé'} (${sPct} %)</span>
                                                  <span class="tabular-amount"><strong>${formatMoney(sc.actualCents, 'EUR', false)}</strong> / ${formatMoney(sc.limitCents, 'EUR', false)}</span>
                                                </div>
                                              </div>
                                            `;
                                          })()
                                        : ''
                                    }
                                  </div>
                                `;
                              })
                              .join('')}
                          </div>
                        </details>
                      `;
                    })
                    .join('')
            }
            `
          );
        }

        function openTxDialog(txId) {
