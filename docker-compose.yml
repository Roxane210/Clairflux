services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
    restart: unless-stopped
    ports:
      - "${CLAIRFLUX_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CLAIRFLUX_ACCESS_SECRET_HASH: ${CLAIRFLUX_ACCESS_SECRET_HASH:?CLAIRFLUX_ACCESS_SECRET_HASH is required}
      CLAIRFLUX_SESSION_SECRET: ${CLAIRFLUX_SESSION_SECRET:?CLAIRFLUX_SESSION_SECRET is required}
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:?INTERNAL_WORKER_TOKEN is required}
      SYNC_WORKER_URL: http://sync-worker:4001
      CLAIRFLUX_WEB_ORIGIN: ${CLAIRFLUX_WEB_ORIGIN:-http://localhost:8080}
      APK_OUTPUT_PATH: /shared-apk/clairflux-release.apk
      CLAIRFLUX_APP_VERSION: ${VITE_APP_VERSION:-1.0.0-rc1}
    volumes:
      - apk-artifacts:/shared-apk:ro
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s

  sync-worker:
    build:
      context: .
      dockerfile: apps/sync-worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      GOOGLE_DRIVE_ACCESS_TOKEN: ${GOOGLE_DRIVE_ACCESS_TOKEN:-}
      GOOGLE_DRIVE_CREDENTIALS_PATH: ${GOOGLE_DRIVE_CREDENTIALS_PATH:-/run/secrets/google_drive_credentials.json}
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:?INTERNAL_WORKER_TOKEN is required}
      ALLOWED_DRIVE_FOLDER_BOURSOBANK: 1pGDvmcePbmIjxJ-lyKdeBMt974GxEx_h
      ALLOWED_DRIVE_FOLDER_REVOLUT: 1cO74NPbgA7kp67Z3rkjAOMqFMDe_Ujus
    volumes:
      - ${GOOGLE_DRIVE_CREDENTIALS_HOST_PATH:-./secrets/google_drive_credentials.json}:/run/secrets/google_drive_credentials.json:ro
    networks:
      - backend_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 60s

  apk-builder:
    build:
      context: .
      dockerfile: Dockerfile.apk-builder
    restart: "no"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0-rc1}
      APK_OUTPUT_DIR: /shared-apk
    volumes:
      - apk-artifacts:/shared-apk

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  apk-artifacts:
